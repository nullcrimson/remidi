[package]
name = "midiremap-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
midiremap-core = { path = "../midiremap-core", features = ["ts"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
serde_bytes = "0.11"
console_error_panic_hook = "0.1.7"
