[workspace]
resolver = "2"
members = ["midiremap-core", "midiremap-cli", "midiremap-wasm", "midiremap-site", "midiremap-testkit", "midiremap-layers", "xtask"]

[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1

[profile.dev.package.midiremap-core]
opt-level = 2

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.midiremap-testkit]
opt-level = 2

[profile.dev.package.askama]
opt-level = 2

[profile.dev.package.fluent-bundle]
opt-level = 2

[profile.dev.package.fluent-syntax]
opt-level = 2

[profile.dev.package.intl-memoizer]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.midly]
opt-level = 2

[profile.dev.package.quick-xml]
opt-level = 2

[profile.dev.package.roxmltree]
opt-level = 2

[profile.dev.package.memchr]
opt-level = 2

[profile.dev.package.scraper]
opt-level = 2

[profile.dev.package.html5ever]
opt-level = 2

[profile.dev.package.markup5ever]
opt-level = 2

[profile.dev.package.selectors]
opt-level = 2

[profile.dev.package.tendril]
opt-level = 2

[profile.dev.package.string_cache]
opt-level = 2

[profile.dev.package.cssparser]
opt-level = 2

[profile.dev.package.ego-tree]
opt-level = 2
