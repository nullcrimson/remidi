[package]
name = "midiremap-kit"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
midiremap-idx = { path = "../midiremap-idx" }
midiremap-note = { path = "../midiremap-note" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
toml = { version = "1.1", optional = true }
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
ts = ["dep:tsify", "dep:wasm-bindgen", "midiremap-note/ts"]
testing = ["dep:toml", "midiremap-note/testing"]

[dev-dependencies]
midiremap-note = { path = "../midiremap-note", features = ["testing"] }
midiremap-testkit = { path = "../midiremap-testkit" }
toml = "1.1"

[build-dependencies]
serde_json = "1"
toml = "1.1"
