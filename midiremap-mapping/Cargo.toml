[package]
name = "midiremap-mapping"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
midiremap-kit = { path = "../midiremap-kit" }
midiremap-note = { path = "../midiremap-note" }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
ts = ["dep:tsify", "dep:wasm-bindgen", "midiremap-kit/ts", "midiremap-note/ts"]

[dev-dependencies]
expect-test = "1.5.1"
midiremap-kit = { path = "../midiremap-kit", features = ["testing"] }
midiremap-note = { path = "../midiremap-note", features = ["testing"] }
rayon = "1"
serde_json = "1"
