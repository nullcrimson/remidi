[package]
name = "midiremap-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
midly = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "1"
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
ts = ["dep:tsify", "dep:wasm-bindgen"]

[dev-dependencies]
midiremap-testkit = { path = "../midiremap-testkit" }
proptest = "1"
toml = "0.8"

[build-dependencies]
serde_json = "1"
toml = "0.8"
