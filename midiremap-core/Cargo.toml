[package]
name = "midiremap-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
midiremap-kit = { path = "../midiremap-kit" }
midiremap-mapping = { path = "../midiremap-mapping" }
midiremap-note = { path = "../midiremap-note" }
midiremap-smf = { path = "../midiremap-smf" }
flate2 = { version = "1", optional = true }
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
plist = { version = "1.10", default-features = false }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
uuid = { version = "1.18", default-features = false, features = ["v5"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
gzip = ["dep:flate2"]
ts = [
    "dep:tsify",
    "dep:wasm-bindgen",
    "midiremap-kit/ts",
    "midiremap-mapping/ts",
    "midiremap-note/ts",
    "midiremap-smf/ts",
]

[dev-dependencies]
expect-test = "1.5.1"
midiremap-kit = { path = "../midiremap-kit", features = ["testing"] }
midiremap-note = { path = "../midiremap-note", features = ["testing"] }
midiremap-testkit = { path = "../midiremap-testkit" }
proptest = "1"
rayon = "1"
roxmltree = "0.21"
toml = "1.1"
