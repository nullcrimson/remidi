[package]
name = "midiremap-smf"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
midiremap-idx = { path = "../midiremap-idx" }
midiremap-note = { path = "../midiremap-note" }
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
ts = ["dep:tsify", "dep:wasm-bindgen", "midiremap-note/ts"]

[dev-dependencies]
midiremap-note = { path = "../midiremap-note", features = ["testing"] }
midiremap-testkit = { path = "../midiremap-testkit" }
serde_json = "1"
