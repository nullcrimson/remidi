[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser reaches only the site tests, through pdf-extract reading back the note map PDFs" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
