[package]
name = "midiremap-site"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
midiremap-core = { path = "../midiremap-core" }
askama = { version = "0.16", default-features = false, features = ["derive", "std", "urlencode"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"

[build-dependencies]
fluent-syntax = "0.12"
heck = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
midiremap-testkit = { path = "../midiremap-testkit" }
roxmltree = "0.21"
scraper = "0.27"
tempfile = "3"
