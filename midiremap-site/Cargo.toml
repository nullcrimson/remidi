[package]
name = "midiremap-site"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
midiremap-core = { path = "../midiremap-core", features = ["gzip"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std", "urlencode"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
skrifa = "0.42"

[build-dependencies]
fluent-syntax = "0.12"
heck = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flate2 = "1"
midiremap-layers = { path = "../midiremap-layers" }
midiremap-testkit = { path = "../midiremap-testkit" }
pdf-extract = "0.12"
roxmltree = "0.21"
scraper = "0.27"
tempfile = "3"
