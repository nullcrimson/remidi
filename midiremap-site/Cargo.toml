[package]
name = "midiremap-site"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
midiremap-core = { path = "../midiremap-core" }
askama = "0.16"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
midiremap-testkit = { path = "../midiremap-testkit" }
roxmltree = "0.21"
