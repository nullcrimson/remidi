<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ meta.title }}</title>
    <meta name="description" content="{{ meta.description }}" />
    <link rel="canonical" href="{{ meta.canonical }}" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#100f0d" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Drumverter" />
    <meta property="og:title" content="{{ meta.title }}" />
    <meta property="og:description" content="{{ meta.description }}" />
    <meta property="og:url" content="{{ meta.canonical }}" />
    <meta property="og:image" content="https://drumverter.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://drumverter.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #0c0e11; --card: #100f0d; --t1: #f2eee6; --t2: #c6c0b1; --t3: #b0a897;
        --t4: #9b9284; --t5: #6d675c; --accent: #e0c46a; --hair: rgba(255, 255, 255, 0.06);
        --ok: #9fc79a; --warn: #e0c46a; --bad: #ff8a8a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--page); color: var(--t3); font: 16px/1.6 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(224, 196, 106, 0.35); text-underline-offset: 4px; }
      a:hover { text-decoration-color: var(--accent); }
      .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
      header.site { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
      header.site a.brand { font: 600 18px 'Space Grotesk', sans-serif; color: var(--t1); text-decoration: none; letter-spacing: 0.02em; text-shadow: 0 0 12px rgba(236, 232, 224, 0.3); }
      header.site nav a { font-size: 14px; margin-left: 16px; }
      main { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; padding: 32px; box-shadow: 0 0 64px -16px rgba(199, 192, 173, 0.09), 0 18px 48px -28px rgba(0, 0, 0, 0.6); }
      h1 { font: 700 30px/1.2 'Space Grotesk', sans-serif; color: var(--t1); margin: 0 0 12px; }
      h2 { font: 600 20px/1.3 'Space Grotesk', sans-serif; color: var(--t1); margin: 36px 0 12px; }
      p.lead { color: var(--t2); margin: 0 0 20px; }
      .cta { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 8px; }
      .cta a { display: inline-block; padding: 10px 16px; border-radius: 10px; background: var(--accent); color: #1b1813; font-weight: 600; text-decoration: none; }
      .cta a.alt { background: transparent; color: var(--accent); border: 1px solid rgba(224, 196, 106, 0.4); }
      .table-wrap { overflow-x: auto; margin-top: 16px; }
      table { width: 100%; border-collapse: collapse; font-size: 15px; }
      th { text-align: left; font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--t5); padding: 8px 10px; border-bottom: 1px solid var(--hair); }
      td { padding: 7px 10px; border-bottom: 1px solid var(--hair); color: var(--t2); }
      td.num { font-family: 'IBM Plex Mono', monospace; color: var(--t4); white-space: nowrap; }
      .exact { color: var(--ok); } .approximated { color: var(--warn); } .dropped { color: var(--bad); }
      ul.links { columns: 2; column-gap: 32px; padding-left: 18px; margin: 8px 0 0; }
      ul.links li { margin: 2px 0; break-inside: avoid; }
      footer.site { margin-top: 28px; font-size: 13px; color: var(--t5); }
      footer.site p { margin: 6px 0; }
      @media (max-width: 600px) { main { padding: 20px 16px; } h1 { font-size: 24px; } ul.links { columns: 1; } header.site nav a { margin: 0 16px 0 0; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="site">
        <a class="brand" href="/">Drumverter</a>
        <nav><a href="/engines/">Engine note maps</a><a href="/">Converter</a></nav>
      </header>
      <main>{% block content %}{% endblock %}</main>
      <footer class="site">
        <p><a href="/">Drumverter</a> · free in-browser drum MIDI converter · <a href="/engines/">All engine note maps</a></p>
        <p>All engine and product names are trademarks of their respective owners; Drumverter is not affiliated with them.</p>
      </footer>
    </div>
  </body>
</html>
