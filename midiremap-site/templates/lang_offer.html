{% if !frame.offers.is_empty() %}<div id="lang-offer" hidden class="flex items-center justify-between gap-4 rounded-chip bg-white/3 p-3 text-ui text-t3">{% for o in frame.offers %}<a hidden data-offer="{{ o.code }}" data-locale="{{ o.code }}" lang="{{ o.tag }}" href="{{ o.href }}" class="prose-link">{{ o.text }}</a>{% endfor %}<button type="button" data-dismiss class="tap text-t5 hover:text-t2" aria-label="{{ frame.dismiss }}">×</button></div>{% endif %}
