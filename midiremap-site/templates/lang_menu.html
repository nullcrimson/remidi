<button id="language-trigger" type="button" popovertarget="language-menu" aria-label="{{ frame.menu_label }}" class="nav-link lang-trigger"><svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="6.5" /><ellipse cx="8" cy="8" rx="3" ry="6.5" /><path d="M1.5 8h13" /></svg><span class="hidden sm:inline">{{ frame.code }}</span><span aria-hidden="true">▾</span></button>
<ul id="language-menu" popover="auto" class="lang-menu">
  {% for l in frame.languages %}<li><a href="{{ l.href }}" hreflang="{{ l.tag }}" lang="{{ l.tag }}" data-locale="{{ l.code }}"{% if l.current %} aria-current="true"{% endif %} class="lang-item">{{ l.name }}</a></li>{% endfor %}
</ul>
