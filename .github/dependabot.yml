version: 2
updates:
  - package-ecosystem: cargo
    directories: ['/', '/midiremap-core/fuzz']
    schedule:
      interval: weekly
    groups:
      rust:
        update-types: [minor, patch]
    ignore:
      # skrifa reads the fonts krilla embeds and must stay on krilla's version; bump both together.
      - dependency-name: skrifa

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/app-with-wasm']
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
