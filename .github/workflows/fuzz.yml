name: Fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz
        default: '600'

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: midiremap-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly
        run: |
          echo "NIGHTLY=$(cat ../nightly-toolchain)" >> "$GITHUB_ENV"
          rustup toolchain install "$(cat ../nightly-toolchain)" --profile minimal --component clippy,rustfmt

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: midiremap-core/fuzz

      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: midiremap-core/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Format and lint the target
        run: |
          cargo +"$NIGHTLY" fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo +"$NIGHTLY" clippy --manifest-path fuzz/Cargo.toml --locked -- -D warnings

      - name: Fuzz convert
        run: |
          mkdir -p fuzz/corpus/convert
          cargo +"$NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu convert fuzz/corpus/convert fuzz/seeds -- \
            -dict=fuzz/midi.dict -max_total_time="${SECONDS_TO_FUZZ}"
        env:
          SECONDS_TO_FUZZ: ${{ inputs.seconds || '600' }}

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: midiremap-core/fuzz/artifacts
