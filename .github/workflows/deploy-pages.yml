name: CI and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FMT_TOOLCHAIN: nightly-2026-05-03

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (from rust-toolchain.toml) and nightly rustfmt
        run: |
          rustup toolchain install
          rustup toolchain install "$FMT_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Rust format
        run: cargo +"$FMT_TOOLCHAIN" fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Read pinned wasm-bindgen version
        id: wb
        run: |
          ver=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed -E 's/version = "(.+)"/\1/')
          echo "wasm-bindgen version: $ver"
          echo "v=$ver" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli (matching Cargo.lock)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.v }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Build wasm
        working-directory: app
        run: npm run build:wasm

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: App tests
        working-directory: app
        run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Read pinned wasm-bindgen version
        id: wb
        run: |
          ver=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed -E 's/version = "(.+)"/\1/')
          echo "wasm-bindgen version: $ver"
          echo "v=$ver" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli (matching Cargo.lock)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.v }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Build (wasm + vite)
        working-directory: app
        run: npm run build

      - name: Generate engine and conversion pages
        run: cargo run -p midiremap-site --release --locked -- app/dist

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        working-directory: app
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report

      - name: Build IndexNow payload from sitemap
        if: github.event_name != 'pull_request'
        id: indexnow
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' app/dist/sitemap.xml | sed -e 's#<loc>\(.*\)</loc>#"\1"#' | paste -sd, -)
          echo "payload={\"host\":\"drumverter.com\",\"key\":\"b70482caafc9bdd6b2cc45b7fd07ddae\",\"keyLocation\":\"https://drumverter.com/b70482caafc9bdd6b2cc45b7fd07ddae.txt\",\"urlList\":[$urls]}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD" https://api.indexnow.org/indexnow
