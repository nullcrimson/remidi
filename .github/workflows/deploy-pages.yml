name: CI and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (from rust-toolchain.toml) and the pinned nightly rustfmt
        run: |
          rustup toolchain install
          rustup toolchain install "$(cat nightly-toolchain)" --profile minimal --component rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format, clippy and tests
        run: cargo xtask gate rust

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/app-with-wasm

      - name: Lint, type check and tests
        run: cargo xtask gate app

  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore site generator
        id: site
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.site-bin
          key: site-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'midiremap-core/**', 'midiremap-site/**', 'engines/**', 'locales/**', 'content/**') }}

      - uses: ./.github/actions/app-with-wasm

      - name: Build app
        run: cargo xtask gate build-app

      - name: Build site generator
        if: steps.site.outputs.cache-hit != 'true'
        run: |
          cargo build -p midiremap-site --release --locked
          mkdir -p ~/.site-bin
          cp target/release/midiremap-site ~/.site-bin/

      - name: Generate engine and conversion pages
        run: ~/.site-bin/midiremap-site app/dist

      - name: Read Playwright version
        id: pw
        working-directory: app
        run: echo "v=$(npx --no-install playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Size budgets and browser tests
        run: cargo xtask gate dist

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report

      - name: Sitemap dates and IndexNow payload for new or changed pages
        if: github.event_name != 'pull_request'
        id: indexnow
        working-directory: app
        run: node scripts/indexnow.ts

      - name: Keep the IndexNow payload for the deploy job
        if: steps.indexnow.outputs.changed != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexnow
          path: app/indexnow.json
          retention-days: 1

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: [rust, app, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "::notice::Cloudflare secrets not set, cache not purged"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' -o /dev/null -w "Cloudflare purge: %{http_code}\n"
      - name: Fetch the IndexNow payload
        if: needs.build.outputs.indexnow != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow
      - name: Notify IndexNow
        if: needs.build.outputs.indexnow != ''
        run: |
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow.json https://api.indexnow.org/indexnow
