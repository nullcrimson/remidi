name: CI and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FMT_TOOLCHAIN: nightly-2026-05-03

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (from rust-toolchain.toml) and nightly rustfmt
        run: |
          rustup toolchain install
          rustup toolchain install "$FMT_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rust format
        run: cargo +"$FMT_TOOLCHAIN" fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read binaryen version
        id: binaryen
        run: echo "v=$(node -p "require('./app/package-lock.json').packages['node_modules/binaryen'].version")" >> "$GITHUB_OUTPUT"

      - name: Restore wasm build
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/wasm
          key: wasm-binaryen${{ steps.binaryen.outputs.v }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'midiremap-core/**', 'midiremap-wasm/**', 'engines/**', 'app/scripts/build-wasm.mjs') }}

      - name: Install Rust (from rust-toolchain.toml)
        if: steps.wasm.outputs.cache-hit != 'true'
        run: rustup toolchain install

      - name: Cache cargo build
        if: steps.wasm.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Read pinned wasm-bindgen version
        if: steps.wasm.outputs.cache-hit != 'true'
        id: wb
        run: |
          ver=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed -E 's/version = "(.+)"/\1/')
          echo "wasm-bindgen version: $ver"
          echo "v=$ver" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli (matching Cargo.lock)
        if: steps.wasm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.v }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Build wasm
        if: steps.wasm.outputs.cache-hit != 'true'
        working-directory: app
        run: npm run build:wasm

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Type check
        working-directory: app
        run: npm run typecheck

      - name: App tests
        working-directory: app
        run: npm test

  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read binaryen version
        id: binaryen
        run: echo "v=$(node -p "require('./app/package-lock.json').packages['node_modules/binaryen'].version")" >> "$GITHUB_OUTPUT"

      - name: Restore wasm build
        id: wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/src/wasm
          key: wasm-binaryen${{ steps.binaryen.outputs.v }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'midiremap-core/**', 'midiremap-wasm/**', 'engines/**', 'app/scripts/build-wasm.mjs') }}

      - name: Restore site generator
        id: site
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.site-bin
          key: site-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'midiremap-core/**', 'midiremap-site/**', 'engines/**', 'locales/**', 'app/src/content/**') }}

      - name: Install Rust (from rust-toolchain.toml)
        if: steps.wasm.outputs.cache-hit != 'true' || steps.site.outputs.cache-hit != 'true'
        run: rustup toolchain install

      - name: Cache cargo build
        if: steps.wasm.outputs.cache-hit != 'true' || steps.site.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Read pinned wasm-bindgen version
        if: steps.wasm.outputs.cache-hit != 'true'
        id: wb
        run: |
          ver=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed -E 's/version = "(.+)"/\1/')
          echo "wasm-bindgen version: $ver"
          echo "v=$ver" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli (matching Cargo.lock)
        if: steps.wasm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.v }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Build wasm
        if: steps.wasm.outputs.cache-hit != 'true'
        working-directory: app
        run: npm run build:wasm

      - name: Generate i18n types
        working-directory: app
        run: npm run gen:i18n

      - name: Build app
        working-directory: app
        run: npm run build --ignore-scripts

      - name: Build site generator
        if: steps.site.outputs.cache-hit != 'true'
        run: |
          cargo build -p midiremap-site --release --locked
          mkdir -p ~/.site-bin
          cp target/release/midiremap-site ~/.site-bin/

      - name: Generate engine and conversion pages
        run: ~/.site-bin/midiremap-site app/dist

      - name: Size budgets
        working-directory: app
        run: npm run size

      - name: Read Playwright version
        id: pw
        working-directory: app
        run: echo "v=$(npx --no-install playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        working-directory: app
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: app/playwright-report

      - name: IndexNow payload for new or changed pages
        if: github.event_name != 'pull_request'
        id: indexnow
        working-directory: app
        run: node scripts/indexnow.ts

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: [rust, app, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Notify IndexNow
        if: needs.build.outputs.indexnow != ''
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD" https://api.indexnow.org/indexnow
