name: App with wasm
description: Rust (for cargo xtask), Node, the app's dependencies and the wasm module, which is rebuilt only when its inputs changed

runs:
  using: composite
  steps:
    - name: Read binaryen version
      id: binaryen
      shell: bash
      run: echo "v=$(node -p "require('./app/package-lock.json').packages['node_modules/binaryen'].version")" >> "$GITHUB_OUTPUT"

    - name: Restore wasm build
      id: wasm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: app/src/wasm
        key: wasm-binaryen${{ steps.binaryen.outputs.v }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'midiremap-core/**', 'midiremap-wasm/**', 'engines/**', 'app/scripts/build-wasm.mjs') }}

    - name: Install Rust (from rust-toolchain.toml)
      shell: bash
      run: rustup toolchain install

    - name: Cache cargo build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Read pinned wasm-bindgen version
      if: steps.wasm.outputs.cache-hit != 'true'
      id: wb
      shell: bash
      run: |
        ver=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed -E 's/version = "(.+)"/\1/')
        echo "wasm-bindgen version: $ver"
        echo "v=$ver" >> "$GITHUB_OUTPUT"

    - name: Install wasm-bindgen-cli (matching Cargo.lock)
      if: steps.wasm.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: wasm-bindgen-cli@${{ steps.wb.outputs.v }}

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install deps
      shell: bash
      working-directory: app
      run: npm ci

    - name: Build wasm
      if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      run: cargo xtask gate build-wasm
